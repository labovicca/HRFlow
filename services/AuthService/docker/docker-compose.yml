services:
  authservice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auth-service
    ports:
      - "8001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDb=Server=auth-db;Database=AuthDb;User Id=sa;Password=admin_hr_flow123;TrustServerCertificate=True;
    depends_on:
      - auth-db
    networks:
      - auth-network

  auth-db:
    container_name: auth-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - MSSQL_SA_PASSWORD=admin_hr_flow123
      - ACCEPT_EULA=Y
    user: root
    restart: always
    ports:
      - "1434:1433"
    volumes:
      - mssql_identity_data:/var/opt/mssql
    networks:
      - auth-network

volumes:
  mssql_identity_data:

networks:
  auth-network:
    driver: bridge
