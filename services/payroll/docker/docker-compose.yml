services:
  postgres-payroll:
    image: postgres:15-alpine
    container_name: payroll-postgres
    environment:
      POSTGRES_DB: payroll_db
      POSTGRES_USER: payroll_user
      POSTGRES_PASSWORD: payroll_pass
    ports:
      - "5434:5432"
    volumes:
      - payroll_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d payroll_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payroll-network

  payroll-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: payroll-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PayrollDb=Host=postgres-payroll;Port=5432;Database=payroll_db;Username=payroll_user;Password=payroll_pass
    depends_on:
      postgres-payroll:
        condition: service_healthy
    networks:
      - payroll-network

volumes:
  payroll_data:

networks:
  payroll-network:
    driver: bridge
